<nb-card class="popup-card full-screen-card" data-backdrop="static">
  <nb-card-header class="text-center"
    >A320 Abnormal/Emergency Event</nb-card-header
  >
  <nb-card-body class="scrollable-body">
    <form #eventForm="ngForm">
      <div class="form-group">
        <label for="eventPhase" class="label">Phase:</label>
        <nb-select
          id="eventPhase"
          name="eventPhase"
          [(ngModel)]="eventData.eventPhase"
          (ngModelChange)="onPhaseChange($event)"
          fullWidth
          placeholder="Select event Phase"
          required
        >
          <nb-option *ngFor="let phase of eventPhases" [value]="phase.value">
            {{ phase.value }} - {{ phase.description }}
          </nb-option>
        </nb-select>

        <small id="eventNameHelp" class="form-text">
          Please select the CE information phase.
        </small>
      </div>

      <!-- Flight Phase Dropdown -->
      <div class="form-group">
        <label for="flightPhase" class="label">Flight Phase:</label>
        <nb-select
          id="flightPhase"
          name="flightPhase"
          [(ngModel)]="eventData.flightPhase"
          (ngModelChange)="onFlightPhaseChange($event)"
          fullWidth
          placeholder="Select Flight Phase"
          required
        >
          <nb-option *ngFor="let phase of flightPhases" [value]="phase.value">
            {{ phase.value }} - {{ phase.description }}
          </nb-option>
        </nb-select>
      </div>

      <!-- Event Name with Autocomplete -->
      <div class="form-group">
        <label for="eventName" class="label">Event Name:</label>
        <input
          type="text"
          nbInput
          fullWidth
          id="eventName"
          name="eventName"
          [(ngModel)]="eventData.eventName"
          placeholder="Search or enter A320 abnormal/emergency procedure"
          [nbAutocomplete]="autoNgModel"
          (ngModelChange)="onEventNameChange($event)"
          required
          aria-describedby="eventNameHelp"
          class="full-width-input"
        />
        <nb-autocomplete #autoNgModel>
          <nb-option
            *ngFor="let event of filteredEvents | async"
            [value]="event.name"
            (selected)="selectEvent($event)"
          >
            {{ event.name }}
          </nb-option>
        </nb-autocomplete>
        <small id="eventNameHelp" class="form-text">
          Type to search A320 procedures or enter a new one.
        </small>
      </div>

      <!-- Detail Textarea -->
      <div class="form-group">
        <label for="detail" class="label">Detail:</label>
        <textarea
          nbInput
          fullWidth
          id="detail"
          name="detail"
          [(ngModel)]="eventData.detail"
          placeholder="Enter event details"
          rows="4"
          aria-describedby="detailHelp"
        ></textarea>
        <small id="detailHelp" class="form-text">
          Provide additional context or observations.
        </small>
      </div>

    </form>
    <!-- Submit & Cancel Buttons moved here from card footer -->
    <div class="text-center" style="margin-top: 20px">
      <button
        nbButton
        status="primary"
        style="margin-right: 10px"
        [disabled]="!eventForm.valid"
        (click)="submitForm()"
      >
        <nb-icon icon="checkmark-circle-2-outline"></nb-icon> Submit
      </button>
      <button nbButton status="danger" outline (click)="closeDialog()">
        <nb-icon icon="close-outline"></nb-icon> Cancel
      </button>
    </div>
  </nb-card-body>
